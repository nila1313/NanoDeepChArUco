name: Unit tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.10
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install unit-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.23.5 opencv-contrib-python-headless==4.11.0.86 PyYAML==6.0.3
          python -m pip install torch==2.0.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps -e .

      - name: Check CLI
        run: nanodeepcharuco --help >/dev/null

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
