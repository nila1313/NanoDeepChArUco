name: nanodeepcharuco

channels:
  - conda-forge

dependencies:
  - python=3.10.21
  - git-lfs
  - pip

  - pip:
      # Versions of the validated setup (Mac/Linux parity).
      # pyproject.toml lists the packages without pinning them.
      - numpy>=1.24
      - opencv-contrib-python-headless>=4.10,<4.12  # OpenCV 5 removed interpolateCornersCharuco (Nano path)
      - PyYAML==6.0.3
      - setuptools>=68,<81  # torchmetrics 0.11 still imports pkg_resources
      - numba>=0.59,<0.60
      - torch==2.0.1
      - pytorch-lightning==1.9.3
      - torchmetrics==0.11.1
      - pydantic==2.13.5
      - pytest>=8,<9
      - -e .[nanodeepcharuco,test]
