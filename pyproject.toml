[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanodeepcharuco"
version = "2.1.0"
description = "CalibCam-compatible stereo ChArUco detection pipeline using OpenCV, ArUco Nano, and DeepChArUco"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-contrib-python-headless>=4.7",
    "pyyaml",
]

[project.optional-dependencies]
nanodeepcharuco = [
    "numba",
    "pydantic",
    "pytorch-lightning",
    "torch",
    "torchmetrics",
]

test = [
    "pytest",
]

[project.scripts]
nanodeepcharuco = "nanodeepcharuco.__main__:main"

[project.entry-points."calibcam.detection_backends"]
nanodeepcharuco = "nanodeepcharuco.calibcam_backend:NanoDeepCharucoBackend"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
