[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanodeepcharuco"
version = "0.1.0"
description = "CalibCam-style Nano + DeepChArUco detection and calibration pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy",
    "opencv-python",
    "PyYAML",
]

[project.scripts]
nanodeepcharuco = "nanodeepcharuco.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
